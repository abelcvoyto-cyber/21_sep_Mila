<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Milagros · una flor amarilla</title>
<meta name="description" content="Una flor amarilla con un mensaje en cada pétalo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="flora izq" id="floraIzq" aria-hidden="true"></div>
<div class="flora der" id="floraDer" aria-hidden="true"></div>

<main class="wrap">
  <header>
    <h1 id="titulo">Para <span id="nombre">Milagros</span></h1>
    <p class="lead">Una flor amarilla con un mensaje en cada pétalo.</p>
  </header>

  <div class="stage" id="stage">
    <svg id="flor" viewBox="0 0 400 560" role="group" aria-label="Una flor amarilla con pétalos que se pueden quitar">
      <defs>
        <linearGradient id="gp" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#F2A100"/><stop offset=".55" stop-color="#FFC93C"/><stop offset="1" stop-color="#FFEB99"/>
        </linearGradient>
        <linearGradient id="gp2" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#F7B416"/><stop offset=".55" stop-color="#FFD766"/><stop offset="1" stop-color="#FFF3BF"/>
        </linearGradient>
        <radialGradient id="gc" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#4A1C0B"/><stop offset=".7" stop-color="#8A3F12"/><stop offset="1" stop-color="#D9822B"/>
        </radialGradient>
        <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5E9A69"/><stop offset="1" stop-color="#3F7A55"/>
        </linearGradient>
        <radialGradient id="gh" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#FFD666" stop-opacity=".55"/><stop offset="1" stop-color="#FFD666" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g class="sway" style="transform-origin:200px 560px">
        <path class="tallo" d="M200 560 C 200 470, 214 340, 200 190"/>
        <path class="hoja" d="M0 0 C 26 -24 74 -26 108 -8 C 74 12 26 14 0 0Z" transform="translate(205 470) rotate(-28)"/>
        <path class="hoja" d="M0 0 C 26 -24 74 -26 108 -8 C 74 12 26 14 0 0Z" transform="translate(199 395) rotate(28) scale(-1 1)"/>
        <circle class="halo" cx="200" cy="185" r="175" fill="url(#gh)"/>
        <g id="petalos"></g>
        <g id="centro" transform="translate(200 185)">
          <circle r="46" fill="url(#gc)"/>
          <g id="semillas"></g>
        </g>
      </g>
    </svg>
    <div class="slip" id="slip" aria-live="polite">
      <p id="frase">Toca un pétalo para leer lo que dice.</p>
    </div>
  </div>

  <div class="controles" id="controles">
    <button class="btn" id="otro" type="button">Quitar otro pétalo</button>
    <p class="cuenta" id="cuenta"></p>
  </div>

  <section class="cierre" id="cierre" hidden>
    <h2 id="cTitulo" tabindex="-1"></h2>
    <p id="cTexto"></p>
    <p class="firma" id="firma"></p>
    <div class="acciones">
      <a class="btn" id="responder" target="_blank" rel="noopener" hidden></a>
      <button class="btn ghost" id="reiniciar" type="button">Volver a empezar</button>
    </div>
  </section>
</main>

<script src="main.js"></script>
</body>
</html>
